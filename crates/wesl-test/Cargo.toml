[package]
name = "wesl-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Test suite for the WESL compiler"
repository.workspace = true
license.workspace = true

[[test]]
harness = false
name = "testsuite"

[dependencies]
regex = { version = "1.13.1", default-features = false, features = ["unicode-perl"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }

[dev-dependencies]
bevy-wgsl = { git = "https://github.com/webgpu-tools/bevy-wgsl", rev = "88faad92779b3ff435a0f9d5fb3b9c5b20732c34" }
insta = { version = "1.49.0", default-features = false, features = ["yaml"] }
libtest-mimic = "0.8.2"
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
wesl = { workspace = true, features = ["eval", "naga-ext"] }
wgsl-parse = { workspace = true }

[lints]
workspace = true
