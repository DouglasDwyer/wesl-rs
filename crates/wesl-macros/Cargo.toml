[package]
name = "wesl-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Macros for the WESL compiler"
repository.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
itertools = "0.15.0"
proc-macro2 = { version = "1.0.107", default-features = false, features = ["proc-macro"] }
quote = { version = "1.0.47", default-features = false, features = ["proc-macro"] }
syn = { version = "3.0.6", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }

[lints]
workspace = true
