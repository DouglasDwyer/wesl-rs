[package]
name = "wesl-quote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Write WESL code inline with quote macros"
repository.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
itertools = "0.15.0"
proc-macro-error3 = { version = "3.1.1" }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["proc-macro"] }
quote = { version = "1.0.47", default-features = false, features = ["proc-macro"] }
syn = { version = "3.0.6", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
token_stream_flatten = { version = "0.1.0" }
wgsl-parse = { workspace = true, features = ["tokrepr"] }

[dev-dependencies]
wesl = { path = "../wesl" }  # for unit tests. We can't use { workspace = true } because of a dependency cycle. see Cargo#4242.

[lints]
workspace = true
